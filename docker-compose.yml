services:
  api:
    build:
      context: ./apps/api
    env_file:
      - .env
    environment:
      - STRATEGY_URL=http://strategy:8090
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    depends_on:
      - strategy
    restart: unless-stopped

  strategy:
    build:
      context: ./apps/strategy
    env_file:
      - .env
    ports:
      - "8090:8090"
    volumes:
      - ./data:/data
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
